<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/CSS/style.css" />
    <script defer src="/JS/script.js"></script>
    <link rel="icon" href="./img/favicon-16x16.png" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
  </head>
  <body>
    <main>
      <img src="./img/pokedeximage2.jpg" alt="Pokedex" class="pokemon-image" />

      <h1 class="pokemon-data">
        <span class="pokemon__number">6</span> -
        <span class="pokemon__name">Charizard</span>
      </h1>

      <form class="search-form">
        <input
          class="search-input"
          type="search"
          placeholder="Search Pokémon or Number..."
          required
        />
      </form>

      <div class="botao">
               <button class="search-button-prev" type="submit">Prev &lt; </button>  
               <button class="search-button-next" type="submit">Next &gt; </button>

      </div>

      <img src="pokedeximage2.jpg" alt="Pokedex" class="pokedex-image" />
    </main>
  </body>
</html>
